[package]
name = "morsekit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal Morse code keyer with live translation"
license = "MIT"
repository = "https://github.com/Necrom4/morsekit"
readme = "README.md"
keywords = ["morse", "morse-code", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities"]
# Keep CI and tooling files out of the published crate, so release-plz ignores changes to them.
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# Only enables clipboard support (OSC 52) on the crossterm that ratatui re-exports.
crossterm = { version = "0.29", default-features = false, features = ["osc52"] }
ratatui = "0.30.2"
rodio = "0.22.2"
