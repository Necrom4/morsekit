[package]
name = "morsekit"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# Only enables clipboard support (OSC 52) on the crossterm that ratatui re-exports.
crossterm = { version = "0.29", default-features = false, features = ["osc52"] }
ratatui = "0.30.2"
rodio = "0.22.2"
