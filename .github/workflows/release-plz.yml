name: release-plz

on:
  push:
    branches:
      - master

jobs:
  # Publishes to crates.io, tags and creates the GitHub release once the release PR is merged.
  release:
    if: github.repository_owner == 'Necrom4'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # `cargo publish` builds the crate, and rodio needs ALSA headers on Linux.
      - &alsa
        name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - &rust
        uses: jdx/mise-action@v5
        with:
          install_args: rust

      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # A personal access token lets the new tag trigger other workflows.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens or updates the release PR with the next version and changelog.
  release-pr:
    if: github.repository_owner == 'Necrom4'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *alsa
      - *rust

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # A personal access token lets CI run on the release PR.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
